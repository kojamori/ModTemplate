name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write # Required for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore

      - name: Pack Template
        shell: pwsh
        run: |
          $out = Join-Path $PWD "bin\Release"
          dotnet pack ".\kojamori.SFS.Templates.CodeMod.csproj" -c Release -o $out

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: kojamori # Your exact NuGet.org username

      - name: NuGet push
        shell: pwsh
        run: |
          dotnet nuget push "bin\Release\*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
