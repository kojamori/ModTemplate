name: Publish NuGet Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore

      - name: Pack Template
        shell: pwsh
        run: |
          $out = Join-Path $PWD "bin\Release"
          dotnet pack ".\kojamori.SFS.Templates.CodeMod.csproj" -c Release -o $out

      - name: NuGet login (OIDC Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: kojamori

      - name: Publish NuGet Package
        shell: pwsh
        run: |
          dotnet nuget push "bin\Release\*.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate
